spring.application.name=deployhub-backend

# No datasource is configured here on purpose. Pick a profile explicitly:
#   local  -> H2 file database under ./data (development only)
#   oracle -> Oracle (local Docker or Autonomous Database), see docs/oracle-setup.md
# Without a profile the app fails at startup instead of silently using an in-memory database.
spring.datasource.url=${DB_URL}

# ---- Sessions & cookies (Milestone 3) ----
# Login state lives in a server-side session; the browser only gets this HttpOnly cookie.
# Set SESSION_COOKIE_SECURE=true whenever the app is served over HTTPS (always in the cloud).
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
deployhub.security.cookie-secure=${SESSION_COOKIE_SECURE:false}

# Brute-force limits (counted in the audit_events table, so they survive restarts)
deployhub.security.login-window=15m
deployhub.security.max-failures-per-account=5
deployhub.security.max-failures-per-ip=30
deployhub.security.registration-window=1h
deployhub.security.max-registrations-per-ip=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true

# ---- Health, readiness, metrics (Milestone 5) ----
# /actuator/health/liveness  = "the process works"  (restart it if not). Deliberately excludes the database:
#                              restarting the app can't fix a database outage.
# /actuator/health/readiness = "send me traffic"    (database reachable + worker polling).
# /actuator/prometheus       = metrics; only reachable from deployhub.metrics.allowed-ips.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,worker
deployhub.metrics.allowed-ips=127.0.0.1/32,::1/128
deployhub.metrics.queue-refresh-interval=10s

# On shutdown: readiness goes DOWN first, open log streams are closed (clients reconnect elsewhere),
# then in-flight requests get up to 20 s to finish.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Deployment workers (Milestone 4). Builds are still SIMULATED. ----
# Set deployhub.worker.enabled=false for API-only nodes; run worker-only processes with
#   java -jar app.jar --spring.profiles.active=oracle --spring.main.web-application-type=none
deployhub.worker.enabled=true
deployhub.worker.id=
deployhub.worker.poll-interval=1s
deployhub.worker.max-concurrent-jobs=2
deployhub.worker.lease-duration=30s
deployhub.worker.step-delay=3s
deployhub.worker.max-attempts=3
deployhub.worker.retry-base-delay=2s
deployhub.worker.retry-max-delay=1m

# Admission control: queued + running deployments allowed per user
deployhub.deployments.max-active-per-user=5

# ---- Live log streaming over Server-Sent Events (Milestone 5) ----
# Each open stream checks the database for new lines every poll interval (workers may run in other
# processes, so the database is the one place every log line is visible). Limits protect the small pool.
deployhub.logs.stream-poll-interval=500ms
deployhub.logs.stream-timeout=10m
deployhub.logs.heartbeat-interval=15s
deployhub.logs.max-streams-per-user=5
deployhub.logs.max-streams=100
