spring.application.name=deployhub-backend

# No datasource is configured here on purpose. Pick a profile explicitly:
#   local  -> H2 file database under ./data (development only)
#   oracle -> Oracle (local Docker or Autonomous Database), see docs/oracle-setup.md
# Without a profile the app fails at startup instead of silently using an in-memory database.
spring.datasource.url=${DB_URL}

# ---- Sessions & cookies (Milestone 3) ----
# Login state lives in a server-side session; the browser only gets this HttpOnly cookie.
# Set SESSION_COOKIE_SECURE=true whenever the app is served over HTTPS (always in the cloud).
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
deployhub.security.cookie-secure=${SESSION_COOKIE_SECURE:false}

# Brute-force limits (counted in the audit_events table, so they survive restarts)
deployhub.security.login-window=15m
deployhub.security.max-failures-per-account=5
deployhub.security.max-failures-per-ip=30
deployhub.security.registration-window=1h
deployhub.security.max-registrations-per-ip=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true

# ---- Health, readiness, metrics (Milestone 5) ----
# /actuator/health/liveness  = "the process works"  (restart it if not). Deliberately excludes the database:
#                              restarting the app can't fix a database outage.
# /actuator/health/readiness = "send me traffic"    (database reachable + worker polling).
# /actuator/prometheus       = metrics; only reachable from deployhub.metrics.allowed-ips.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,worker
deployhub.metrics.allowed-ips=127.0.0.1/32,::1/128
deployhub.metrics.queue-refresh-interval=10s

# On shutdown: readiness goes DOWN first, open log streams are closed (clients reconnect elsewhere),
# then in-flight requests get up to 20 s to finish.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Deployment workers (Milestone 4) ----
# Set deployhub.worker.enabled=false for API-only nodes; run worker-only processes with
#   java -jar app.jar --spring.profiles.active=oracle --spring.main.web-application-type=none
deployhub.worker.enabled=true
deployhub.worker.id=
deployhub.worker.poll-interval=1s
deployhub.worker.max-concurrent-jobs=2
deployhub.worker.lease-duration=30s
# Pause between steps of a SIMULATED deployment (real builds take as long as they take)
deployhub.worker.step-delay=3s
deployhub.worker.max-attempts=3
deployhub.worker.retry-base-delay=2s
deployhub.worker.retry-max-delay=1m

# ---- Real builds in Docker (Milestone 6) ----
# REAL = clone, docker build, docker run, health check. SIMULATED = the built-in simulator (no Docker needed).
# Only public repositories are supported: git runs with every credential helper switched off.
deployhub.execution.mode=REAL
deployhub.execution.docker-command=docker
deployhub.execution.git-command=git
deployhub.execution.workspace=${java.io.tmpdir}/deployhub-builds
deployhub.execution.clone-timeout=2m
deployhub.execution.build-timeout=15m
deployhub.execution.start-timeout=2m
# Apps are published on 127.0.0.1 only (this machine), one port per running deployment.
deployhub.execution.port-range-start=20000
deployhub.execution.port-range-end=20999
deployhub.execution.container-memory=512m
deployhub.execution.container-cpus=1.0
deployhub.execution.container-pids-limit=256
deployhub.execution.max-log-lines-per-step=3000
# Images of the last N successful deployments per project are kept (instant rollback); older ones are removed.
deployhub.execution.keep-images-per-project=3

# ---- Fixed project addresses (Milestone 6) ----
# Every project gets http://localhost:<port> from this range. A small nginx container per project forwards
# it to the project's live app, and route prefixes (e.g. /api) to other projects' live apps.
deployhub.gateway.port-range-start=19000
deployhub.gateway.port-range-end=19999
deployhub.gateway.proxy-image=nginx:1.27-alpine
# Public links (opt-in per project): a Cloudflare quick tunnel, no account needed. The link is random and
# changes whenever the tunnel restarts; DeployHub re-reads it on this interval and shows the current one.
deployhub.gateway.tunnel-image=cloudflare/cloudflared:latest
deployhub.gateway.public-link-refresh=30s

# ---- One-click databases (Milestone 6) ----
# One shared MySQL server, created on first use; each project gets its own database and user in it.
deployhub.databases.mysql-image=mysql:8.4
deployhub.databases.container-name=deployhub-mysql
deployhub.databases.volume=deployhub-mysql-data
deployhub.databases.host-port=3307
deployhub.databases.memory=512m
deployhub.databases.start-timeout=3m

# ---- Secrets ----
# Encrypts environment variable values. Keep it outside git (e.g. in deployhub-backend/.env); losing or
# changing it makes stored values unreadable. Create one with: openssl rand -base64 32
deployhub.secrets.key=${DEPLOYHUB_SECRETS_KEY:}

# Admission control: queued + running deployments allowed per user
deployhub.deployments.max-active-per-user=5

# ---- Live log streaming over Server-Sent Events (Milestone 5) ----
# Each open stream checks the database for new lines every poll interval (workers may run in other
# processes, so the database is the one place every log line is visible). Limits protect the small pool.
deployhub.logs.stream-poll-interval=500ms
deployhub.logs.stream-timeout=10m
deployhub.logs.heartbeat-interval=15s
deployhub.logs.max-streams-per-user=5
deployhub.logs.max-streams=100

# ---- Forgot password (email code) ----
# A 6-digit code is emailed to the account; it works once, for code-ttl, with max-attempts guesses.
deployhub.password-reset.code-ttl=10m
deployhub.password-reset.max-attempts=5
# Codes requested per email and per IP within the window (stops email flooding); wrong codes allowed per IP.
deployhub.password-reset.request-window=1h
deployhub.password-reset.max-requests-per-email=5
deployhub.password-reset.max-requests-per-ip=20
deployhub.password-reset.max-failures-per-ip=30

# Email via Gmail: MAIL_USERNAME = your Gmail address, MAIL_PASSWORD = a Google "App password" (16 letters,
# needs 2-Step Verification), both in the git-ignored .env file. Without MAIL_USERNAME no email is sent:
# the code is written to the backend log instead (development only).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
deployhub.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
