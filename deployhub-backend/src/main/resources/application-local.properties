# LOCAL DEVELOPMENT ONLY. H2 file database in Oracle compatibility mode.
# H2 passing does NOT prove Oracle compatibility.
# Secrets such as DEPLOYHUB_SECRETS_KEY can come from the git-ignored .env file, as with the oracle profile.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:h2:file:./data/deployhub;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Milestone 1-2 seeded a passwordless dev user via a repeatable migration that no longer exists.
# Tolerate its history row in existing local databases instead of forcing a reset.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 reports Oracle's NUMBER(19) as NUMERIC, which Hibernate's validator rejects even though it
# works. Flyway still owns the schema; full validation runs against real Oracle (Milestone 2).
spring.jpa.hibernate.ddl-auto=none
