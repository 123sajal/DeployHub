# Oracle Autonomous Database (or any Oracle 19c+). See docs/oracle-setup.md.
# Values come from environment variables, or from a git-ignored deployhub-backend/.env file.
# There is NO fallback: if Oracle is unreachable, startup fails.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Always Free ADB allows ~20 concurrent sessions in total, so keep the pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Hibernate checks every entity against the real Oracle schema at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
