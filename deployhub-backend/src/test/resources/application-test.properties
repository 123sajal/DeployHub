spring.datasource.url=jdbc:h2:mem:deployhub-test;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Every test registers fresh users from 127.0.0.1; keep the per-IP sign-up limit out of the way
# (RegistrationThrottleTest lowers it again to prove it works).
deployhub.security.max-registrations-per-ip=100000

# Tests drive the worker by calling it directly; no sleeping between steps or before retries.
deployhub.worker.enabled=false
deployhub.worker.id=test-worker
deployhub.worker.step-delay=0s
deployhub.worker.retry-base-delay=0s

# H2 reports Oracle's NUMBER(19) as NUMERIC, which Hibernate's validator rejects even though it
# works. Flyway still owns the schema; full validation runs against real Oracle (Milestone 2).
spring.jpa.hibernate.ddl-auto=none

# Live log streams check for new lines quickly, so streaming tests finish fast.
deployhub.logs.stream-poll-interval=50ms
